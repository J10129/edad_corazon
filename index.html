<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Evaluación Cardiovascular Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg-color: #0f172a;
    --card-color: #1e293b;
    --button-color: #334155;
    --button-hover: #ef4444;
    --text-color: #fff;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

h1 {
    text-align: center;
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 30px;
    color: var(--button-hover);
}

.question {
    background: var(--card-color);
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    transition: transform 0.2s;
}

.question:hover {
    transform: translateY(-2px);
}

button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    background: var(--button-color);
    color: var(--text-color);
    font-size: 1rem;
    transition: background 0.3s, transform 0.2s;
}

button:hover {
    background: var(--button-hover);
    transform: scale(1.02);
}

.result {
    margin-top: 30px;
    padding: 25px;
    background: var(--card-color);
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    opacity: 0;
    transform: scale(0.9);
    transition: all 0.5s ease;
}

.result.show {
    opacity: 1;
    transform: scale(1);
}

.semaforo {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
}

.luz {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #374151;
    opacity: 0.3;
    transition: all 0.5s ease;
}

.luz.green {
    background: var(--green);
}

.luz.yellow {
    background: var(--yellow);
}

.luz.red {
    background: var(--red);
}

.luz.active {
    opacity: 1;
    transform: scale(1.2);
    animation: latido 1s infinite alternate;
}

@keyframes latido {
    0% { transform: scale(1.2); }
    50% { transform: scale(1); }
    100% { transform: scale(1.2); }
}

h3 {
    font-weight: 700;
    margin: 10px 0;
}

p {
    font-weight: 400;
    line-height: 1.5;
}
</style>
</head>
<body>

<div class="container">

<h1>🫀 Evaluación de riesgo cardiovascular</h1>

<div id="quiz"></div>

<button onclick="calcular()">Ver resultado</button>

<div id="resultado" class="result"></div>

</div>

<script>
const preguntas = [
{ texto: "Edad", opciones: [["12–15",0],["16–18",1],["19–25",2],["26–35",4],["36–45",6],["46+",8]] },
{ texto: "Sexo", opciones: [["Hombre",2],["Mujer",0]] },
{ texto: "Actividad física", opciones: [["5+ días",-3],["3–4 días",-1],["1–2 días",1],["0 días",3]] },
{ texto: "Tiempo sentado", opciones: [["<4h",0],["4–7h",1],["7–10h",2],["10h+",3]] },
{ texto: "Ultraprocesados", opciones: [["Casi nunca",0],["2–3/semana",1],["4–6/semana",2],["Diario",3]] },
{ texto: "Bebidas azucaradas", opciones: [["Nunca",0],["1–2/semana",1],["3–5/semana",2],["Diario",4]] },
{ texto: "Sueño", opciones: [["7–9h",0],["6–7h",1],["<6h",3]] },
{ texto: "Tabaco", opciones: [["No",0],["Ocasional",2],["Diario",5]] },
{ texto: "Estrés", opciones: [["Bajo",0],["Medio",1],["Alto",3]] },
{ texto: "Peso", opciones: [["Normal",0],["Sobrepeso",2],["Obesidad",4]] },
{ texto: "Historial familiar", opciones: [["No",0],["Sí",3]] }
];

const quiz = document.getElementById("quiz");
let respuestas = new Array(preguntas.length).fill(null);

preguntas.forEach((p, i) => {
let div = document.createElement("div");
div.className = "question";

let html = `<h3>${p.texto}</h3>`;

p.opciones.forEach(op => {
html += `<button onclick="seleccionar(${i}, ${op[1]}, this)">${op[0]}</button>`;
});

div.innerHTML = html;
quiz.appendChild(div);
});

function seleccionar(pregunta, valor, boton) {
respuestas[pregunta] = valor;

let botones = boton.parentNode.querySelectorAll("button");
botones.forEach(b => b.style.background = "#334155");

boton.style.background = "#ef4444";
}

function calcular() {

if (respuestas.includes(null)) {
alert("Responde todas las preguntas");
return;
}

let puntos = respuestas.reduce((a,b) => a + b, 0);

let nivel = "";
let conclusion = "";
let colorClass = "";

if (puntos <= 5) {
nivel = "RIESGO BAJO";
colorClass = "green";
conclusion = "Tu estilo de vida es bastante saludable. Mantén estos hábitos para proteger tu corazón.";
} else if (puntos <= 15) {
nivel = "RIESGO MODERADO";
colorClass = "yellow";
conclusion = "Hay algunos hábitos que podrían afectar tu salud cardiovascular. Pequeños cambios pueden marcar la diferencia.";
} else {
nivel = "RIESGO ALTO";
colorClass = "red";
conclusion = "Tu estilo de vida puede aumentar el riesgo cardiovascular. Es recomendable hacer cambios cuanto antes.";
}

document.getElementById("resultado").classList.add("show");

document.getElementById("resultado").innerHTML = `
<h2>Resultado de tu evaluación</h2>

<div class="semaforo">
<div class="luz green ${colorClass === 'green' ? 'active' : ''}"></div>
<div class="luz yellow ${colorClass === 'yellow' ? 'active' : ''}"></div>
<div class="luz red ${colorClass === 'red' ? 'active' : ''}"></div>
</div>

<h3>${nivel}</h3>
<p>${conclusion}</p>
`;
}
</script>

</body>
</html>
